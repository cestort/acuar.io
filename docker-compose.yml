# Despliegue en el VPS.
#
# Variables leídas del fichero .env de este directorio (lo genera GitHub Actions):
#   BIND_IP     IP donde se publican los puertos. Por defecto la IP de WireGuard,
#               así la app y ntfy no son accesibles desde internet.
#   WG_BIND_IP  IP del VPS dentro de la VPN (la que usa el móvil).
#   APP_PORT, NTFY_PORT, DJANGO_SECRET_KEY, OPENROUTER_API_KEY...
#
# Ojo: Docker publica los puertos saltándose UFW. Con BIND_IP=0.0.0.0 los puertos
# quedarían abiertos a internet aunque el cortafuegos diga lo contrario.

name: acuario

services:
  app:
    build: .
    image: acuario-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_DEBUG: "false"
      NTFY_URL: http://ntfy
    ports:
      - "${BIND_IP:?Define BIND_IP en .env}:${APP_PORT:-7733}:8000"
    volumes:
      - app_data:/data
    depends_on:
      - ntfy

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://${WG_BIND_IP:?Define WG_BIND_IP en .env}:${NTFY_PORT:-7734}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_BEHIND_PROXY: "false"
      TZ: Europe/Madrid
    ports:
      - "${BIND_IP}:${NTFY_PORT:-7734}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy

volumes:
  app_data:
  ntfy_cache:
