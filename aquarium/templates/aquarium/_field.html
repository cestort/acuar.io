<div class="field{% if field.errors %} field--error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field--check{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if hint %} <small>{{ hint }}</small>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
