{% if page.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">← Anteriores</a>{% else %}<span></span>{% endif %}
  <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?page={{ page.next_page_number }}">Siguientes →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
